name: Publicar download direto do APK PT-BR
on:
  workflow_run:
    workflows: ["APK em português brasileiro (Chromecast 4K)"]
    types: [completed]
permissions:
  contents: write
  actions: read
jobs:
  publicar:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publicar apenas compilação compatível com o código atual
        id: gate
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_CERT: ${{ secrets.CLEAN_TV_CERT_SHA256 }}
        run: |
          git cat-file -e "$SOURCE_SHA^{commit}"
          CHANGED="$(git diff --name-only "$SOURCE_SHA" HEAD | grep -Ev '^(.github/workflows/ptbr-release.yml|docs/)' || true)"
          if [ -n "$CHANGED" ]; then
            echo "Uma compilação mais nova já está disponível; ignorando esta."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Baixar APK da compilação aprovada
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name CleanYourTV-PTBR-Chromecast4K-APK --dir ./dist
          find dist -type f -name '*.apk' -print
          APK="$(find dist -type f -name '*.apk' -print -quit)"
          test -s "$APK"
          cp "$APK" dist/CleanYourTV.apk
      - name: Publicar APK diretamente no GitHub Releases
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.CLEAN_TV_RELEASE_TOKEN || github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_CERT: ${{ secrets.CLEAN_TV_CERT_SHA256 }}
        run: |
          SOURCE_RUN="${{ github.event.workflow_run.run_number }}"
          TAG="ptbr-r${SOURCE_RUN}-${SOURCE_SHA:0:8}"
          cat > dist/LEIA-ME.txt <<'TXT'
          CleanYourTV é instalado no celular e gerencia dispositivos Android compatíveis.
          Instale no celular, não no Chromecast.
          Esta edição permanente usa o pacote tv.cleanyour.app.personal para
          coexistir com a edição anterior assinada com chave Android Debug.
          Os dados da edição antiga não migram automaticamente entre pacotes.
          O status e certificado da assinatura constam em build-information.txt e apk-certificate.txt.
          Para atualizar no lugar da versão anterior, todas as compilações
          devem usar a mesma chave de assinatura Android, armazenada em
          Secrets do GitHub Actions. Sem isso, o Android exige desinstalação.
          Novas versões são identificadas pelo numero crescente do run.
          O perfil do Chromecast preserva o Google Cast e a tela inicial original.
          Verifique a cobertura de idioma no relatório ptbr-cobertura.json.
          TXT
          # Nunca publicar build debug ou assinatura diferente da identidade
          # fixada pelo proprietário. Impede oferecer update que Android recusaria.
          grep -qx 'signing=owned' dist/build-information.txt
          grep -qx 'package=tv.cleanyour.app.personal' dist/build-information.txt
          EXPECTED_CERT="$(printf '%s' "$EXPECTED_CERT" | tr '[:upper:]' '[:lower:]')"
          test -n "$EXPECTED_CERT"
          grep -qx "certificateSha256=$EXPECTED_CERT" dist/build-information.txt
          grep -Fq "$EXPECTED_CERT" dist/apk-certificate.txt
          test -s dist/CleanYourTV.apk
          EXPECTED_HASH="$(sed -n 's/^apkSha256=//p' dist/build-information.txt)"
          test "$EXPECTED_HASH" = "$(sha256sum dist/CleanYourTV.apk | cut -d' ' -f1)"
          # On some forks, workflow_run gets read-only GITHUB_TOKEN, even with
          # permissions.contents=write. The optional owned PAT fixes publishing.
          gh release create "$TAG" \
            dist/CleanYourTV.apk \
            dist/ptbr-cobertura.json \
            dist/LEIA-ME.txt \
            dist/build-information.txt \
            dist/apk-certificate.txt \
            --latest \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "CleanYourTV — TV, Android e Wear OS (r${SOURCE_RUN})" \
            --notes "Edição assinada permanente do CleanYourTV, instalada ao lado de edições antigas Debug com dados separados. APK Android do controlador CleanYourTV, compilado no GitHub Actions e comunicado pelo verificador de atualizações no aplicativo. Instalação exige confirmação do Android. Consulte build-information.txt para o tipo de assinatura; build de produção assinado com a chave permanente do proprietário e SHA-256 verificado. Instalação exige consentimento explícito do Android."
