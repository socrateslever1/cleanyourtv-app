name: Verificar implementação Android multidispositivo (isolada)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-remote-android.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-remote:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Ler somente a branch em desenvolvimento
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/multi-android-policy
          submodules: recursive
          persist-credentials: false
      - name: Configurar Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Verificar políticas, backup, APK e compilação
        run: |
          chmod +x gradlew
          git rev-parse HEAD
          ./gradlew :core:ops:test :app:testFullDebugUnitTest :app:assembleFullRelease --console=plain --no-daemon
      - name: Disponibilizar relatórios se falhar
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnosticos-remote-android
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7
