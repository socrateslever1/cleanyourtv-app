name: APK em português brasileiro (Chromecast 4K)
on:
  push:
    branches: [main]
    paths: ['app/**', 'feature/**', 'ui/**', 'core/**', 'adb/**', 'android/**', 'build-logic/**', 'gradle/**', 'scripts/localize_ptbr.py', '.github/workflows/ptbr-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: signed-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Exigir identidade e assinatura de produção
        shell: bash
        env:
          KEY_B64: ${{ secrets.CLEAN_TV_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.CLEAN_TV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CLEAN_TV_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.CLEAN_TV_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.CLEAN_TV_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for key in KEY_B64 STORE_PASS KEY_ALIAS KEY_PASS CERT_SHA256; do
            if [ -z "${!key}" ]; then
              echo "::error::Assinatura permanente ainda não configurada ($key). Build de produção bloqueado."
              exit 1
            fi
          done
          [[ "$CERT_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "::error::Fingerprint SHA256 inválido"; exit 1; }
          mkdir -p "$RUNNER_TEMP/cleanyourtv-private"
          chmod 700 "$RUNNER_TEMP/cleanyourtv-private"
          KEYSTORE="$RUNNER_TEMP/cleanyourtv-private/signing.jks"
          printf '%s' "$KEY_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" > /dev/null
          PUBLIC_CERT="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="$(printf '%s' "$CERT_SHA256" | tr '[:upper:]' '[:lower:]')"
          if [ "$PUBLIC_CERT" != "$EXPECTED" ]; then
            echo "::error::Certificado inesperado. Chave trocada? Abortando para evitar falha de atualização."
            exit 1
          fi
          echo "CYT_RELEASE_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "CLEAN_TV_CERT=$PUBLIC_CERT" >> "$GITHUB_ENV"
          echo "CLEAN_TV_VERSION_CODE=$((1000000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "CLEAN_TV_VERSION_NAME=1.0.0-ptbr.r$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Gerar recursos pt-BR
        run: |
          python3 scripts/localize_ptbr.py --root . --report ptbr-cobertura.json
          python3 -m json.tool ptbr-cobertura.json >/dev/null
      - name: Validar testes, lint e regressões visuais
        env:
          CYT_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.CLEAN_TV_KEYSTORE_PASSWORD }}
          CYT_RELEASE_KEY_ALIAS: ${{ secrets.CLEAN_TV_KEY_ALIAS }}
          CYT_RELEASE_KEY_PASSWORD: ${{ secrets.CLEAN_TV_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew check verifyRoborazziDebug --no-daemon --console=plain
      - name: Compilar fullRelease (não depurável)
        env:
          CYT_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.CLEAN_TV_KEYSTORE_PASSWORD }}
          CYT_RELEASE_KEY_ALIAS: ${{ secrets.CLEAN_TV_KEY_ALIAS }}
          CYT_RELEASE_KEY_PASSWORD: ${{ secrets.CLEAN_TV_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFullRelease --no-daemon --stacktrace --console=plain
      - name: Verificar APK, assinatura, pacote e versão
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/full/release -type f -name '*.apk' -print -quit)"
          test -s "$APK"
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee apk-certificate.txt
          CERT="$(sed -nE 's/^.*certificate SHA-256 digest: ([[:xdigit:]]{64}).*$/\1/p' apk-certificate.txt | head -1 | tr '[:upper:]' '[:lower:]')"
          [ -n "$CERT" ] && [ "$CERT" = "$CLEAN_TV_CERT" ] || { echo "::error::Certificado no APK inválido"; exit 1; }
          BADGING="$("$TOOLS/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -Fq "package: name='tv.cleanyour.app.cleaninstall'"
          echo "$BADGING" | grep -Fq "versionCode='$CLEAN_TV_VERSION_CODE'"
          echo "$BADGING" | grep -Fq "versionName='$CLEAN_TV_VERSION_NAME'"
          printf 'version=%s\nversionCode=%s\nsigning=owned\npackage=tv.cleanyour.app.cleaninstall\ncertificateSha256=%s\napkSha256=%s\nrun=%s\n' \
            "$CLEAN_TV_VERSION_NAME" "$CLEAN_TV_VERSION_CODE" "$CERT" "$(sha256sum "$APK" | cut -d' ' -f1)" "$GITHUB_RUN_NUMBER" > build-information.txt
          cat build-information.txt
      - name: Publicar artefato assinado e auditável
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-PTBR-Chromecast4K-APK
          path: |
            app/build/outputs/apk/full/release/*.apk
            apk-certificate.txt
            build-information.txt
            ptbr-cobertura.json
          retention-days: 30
          if-no-files-found: error
      - name: Apagar chave temporária do runner
        if: always()
        run: |
          if [ -n "${CYT_RELEASE_KEYSTORE:-}" ] && [ -f "$CYT_RELEASE_KEYSTORE" ]; then
            shred -u "$CYT_RELEASE_KEYSTORE" || rm -f "$CYT_RELEASE_KEYSTORE"
          fi
